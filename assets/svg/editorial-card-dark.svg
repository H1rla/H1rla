<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="title description">
  <title id="title">Akira Hirasawa</title>
  <desc id="description">Computer science student exploring systems and security. Currently learning Linux internals, exploring systems security, and building small tools.</desc>

  <style>
    .display {
      font-family: Georgia, "Times New Roman", Times, serif;
    }
    .body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .meta {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
  </style>

  <rect width="1200" height="480" fill="#111315"/>
  <!-- The inset frame keeps the card edge visible against GitHub's dark canvas. -->
  <rect x="1" y="1" width="1198" height="478" fill="none" stroke="#2c3033" stroke-width="2"/>

  <line x1="64" y1="62" x2="1136" y2="62" stroke="#3a3e41" stroke-width="1"/>

  <text class="display" x="64" y="178" fill="#f0ede7" font-size="88" font-weight="700" letter-spacing="-3.4">Akira Hirasawa</text>
  <text class="display" x="68" y="224" fill="#a9abad" font-size="29" font-style="italic" letter-spacing="-0.2">Computer science student exploring systems and security.</text>

  <line x1="64" y1="284" x2="1136" y2="284" stroke="#3a3e41" stroke-width="1"/>

  <text class="meta" x="64" y="326" fill="#7f8386" font-size="13" font-weight="600" letter-spacing="3.2">CURRENTLY</text>
  <line x1="244" y1="304" x2="244" y2="377" stroke="#303437" stroke-width="1"/>
  <text class="body" x="284" y="326" fill="#d5d3ce" font-size="25" font-weight="400" letter-spacing="0.1">
    <tspan x="284" dy="0">Learning Linux internals, exploring systems security,</tspan>
    <tspan x="284" dy="32">and building small tools.</tspan>
  </text>

  <line x1="64" y1="416" x2="1136" y2="416" stroke="#3a3e41" stroke-width="1"/>
  <text class="meta" x="64" y="448" fill="#777b7e" font-size="13" letter-spacing="2.2">H1rla · 2026</text>
